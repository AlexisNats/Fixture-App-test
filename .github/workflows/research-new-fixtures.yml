name: Research new fixtures (auto-merge verified, PR for the rest)

# Runs monthly, uses Claude (with web search) to look for real new
# fixtures, then runs a SECOND independent Claude pass whose only job is
# to try to disprove each one. Fixtures that pass verification are
# committed directly — no human step. Fixtures that don't pass (or that
# the verifier is genuinely unsure about) open a Pull Request instead,
# same as before this workflow had a verification step at all.
#
# This is a deliberate middle ground, not "fully automatic with no
# safety net" — see scripts/verify-and-merge-fixtures.js for the honest
# reasoning on what a second AI pass can and can't catch.

on:
  schedule:
    # Monthly, not weekly — see README "Keeping the dataset fresh" for
    # why more frequent runs wouldn't actually find proportionally more.
    - cron: '0 6 1 * *'
  workflow_dispatch:
    # Manual trigger from the Actions tab, for whenever you want to run
    # this outside the monthly schedule.

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Research new fixtures (proposal pass)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/research-new-fixtures.js

      - name: Verify each proposal and auto-merge what passes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/verify-and-merge-fixtures.js

      - name: Validate data integrity before committing anything
        run: node scripts/validate-data-integrity.js
        # If this fails, the workflow stops here — nothing gets committed
        # or pushed. This exists specifically because the two real bugs
        # that caused a multi-day debugging saga (a city/sport reference
        # with no matching entry, and missing map coordinates) both came
        # from data reaching a live deploy with nothing catching them
        # first. This step is that catch, run automatically every time,
        # not something that has to be remembered.

      - name: Commit and push anything auto-merged
        id: automerge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/seed-data.js frontend/index.html
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-merged fixture(s) that passed independent verification"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a PR for anything uncertain (only if something needs review)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Uncertain fixtures — needs your review before merging"
          title: "🔍 Fixtures needing review (failed or unclear on independent verification)"
          body: |
            This PR was opened automatically. Everything in this PR is here
            SPECIFICALLY because the independent verification pass could not
            confirm it — anything that passed was already auto-merged
            directly to main without a PR, so you won't see that here.

            **How to review this:**
            1. Open `uncertain-fixtures.json` in this PR
            2. Each entry has a `"verificationNote"` field explaining exactly
               why it didn't pass — a specific problem found, or that no
               independent confirmation could be located
            3. If you want to accept one anyway (e.g. you know the source is
               right despite the flag), you'll need to manually format it
               into `backend/seed-data.js` yourself, or ask Claude to do it
               interactively — this PR's file is a proposal list, not
               something that gets merged as-is
            4. If you don't want any of them, just close this PR — nothing
               changes

            You'll get GitHub's normal notification for this PR (check
            Settings → Notifications if you're not seeing them) — no
            separate notification system needed beyond that.
          branch: fixtures-needing-review
          add-paths: uncertain-fixtures.json
