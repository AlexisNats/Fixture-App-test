<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Fixture</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fixture">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#10151F">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --ink:#10151F; --ink-raised:#161D2B; --amber:#FFB100; --paper:#F5F1E8;
  --pitch:#2F6F4F; --chalk:#EDEAE0; --slate:#8A8578; --sold:#B4483C; --blue:#4A7FB5;
  /* "chrome" tokens are the ones that actually swap between dark/light mode.
     --ink/--chalk/--paper etc above stay fixed — they're used as "always
     dark ink" / "always light paper" colors inside cards and the ticker,
     which intentionally keep their look in both themes (the ticker in
     particular is meant to look like a permanently-lit scoreboard sign). */
  --chrome-bg:var(--ink); --chrome-surface:var(--ink-raised);
  --chrome-text:var(--chalk); --chrome-text-muted:var(--slate);
  --chrome-border:rgba(237,234,224,0.18);
  --map-label-bg:rgba(16,21,31,0.75); --map-label-text:#EDEAE0;
}
[data-theme="light"]{
  --chrome-bg:#F7F5EF; --chrome-surface:#EAE4D6;
  --chrome-text:#10151F; --chrome-text-muted:#6B6558;
  --chrome-border:rgba(16,21,31,0.15);
  --map-label-bg:rgba(255,255,255,0.88); --map-label-text:#10151F;
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin:0; height:100%; background:var(--chrome-bg); overscroll-behavior:none; transition:background 0.2s ease;}
body{font-family:'IBM Plex Sans',sans-serif; color:var(--chrome-text);}
#app{display:flex; flex-direction:column; height:100vh; height:100dvh; max-width:520px; margin:0 auto; position:relative; overflow:hidden;}
/* Cheap fluid-layout fix for desktop/wide screens — not a bespoke redesign,
   just stops the app being a narrow mobile column stranded in a sea of
   empty space on a laptop/desktop browser. Everything inside is already
   flex/relative, so widening the container is enough to make it usable;
   a real side-by-side desktop layout (map+list together, sidebar filters)
   is a deliberately separate, later phase. */
@media (min-width: 900px){
  #app{max-width:1100px; margin:24px auto; height:calc(100vh - 48px); height:calc(100dvh - 48px); border-radius:18px; box-shadow:0 20px 60px rgba(0,0,0,0.35); border:1px solid var(--chrome-border);}
}
.header{padding:calc(env(safe-area-inset-top) + 14px) 18px 8px;}
.header-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.wordmark{font-family:'Oswald',sans-serif; font-size:22px; font-weight:700; letter-spacing:0.5px;}
.wordmark .dot{color:var(--amber);}
.header-right{display:flex; align-items:center; gap:10px;}
.count{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--chrome-text-muted); letter-spacing:0.5px;}
.avatar-btn,.theme-btn{width:32px; height:32px; border-radius:50%; border:1.5px solid var(--chrome-border); background:var(--chrome-surface); color:var(--chrome-text); font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:13px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
.avatar-btn.logged-in{background:var(--amber); color:var(--ink); border-color:var(--amber);}
.live-status{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.3px; padding:0 18px 8px; color:var(--chrome-text-muted); display:flex; align-items:center; gap:6px;}
.live-dot{width:6px; height:6px; border-radius:50%; background:var(--chrome-text-muted); flex-shrink:0;}
.live-status.ok .live-dot{background:#4CAF50; box-shadow:0 0 0 3px rgba(76,175,80,0.25);}
.live-status.fail .live-dot{background:var(--sold);}
.badge-live{font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:600; letter-spacing:0.4px; color:#4CAF50; border:1px solid #4CAF50; border-radius:4px; padding:2px 5px; margin-left:6px;}
.badge-real{font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:600; letter-spacing:0.4px; color:#4A9FE0; border:1px solid #4A9FE0; border-radius:4px; padding:2px 5px; margin-left:6px;}
.badge-demo{font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:600; letter-spacing:0.4px; color:var(--slate); border:1px solid var(--slate); border-radius:4px; padding:2px 5px; margin-left:6px;}
.search-row{display:flex; gap:8px; padding:10px 18px 4px; align-items:center;}
.search-box{flex:1; display:flex; align-items:center; gap:7px; background:var(--chrome-surface); border:1px solid var(--chrome-border); border-radius:9px; padding:0 12px; height:38px;}
.search-icon{font-size:13px; opacity:0.7; flex-shrink:0;}
.search-box input[type="search"]{flex:1; min-width:0; border:none; background:none; outline:none; font-family:'IBM Plex Sans',sans-serif; font-size:13.5px; color:var(--chrome-text); height:100%;}
.search-box input[type="search"]::placeholder{color:var(--chrome-text-muted);}
.search-box input[type="search"]::-webkit-search-cancel-button{filter:var(--search-cancel-filter, none);}
#dateInput{flex:0 0 auto; width:118px; height:38px; border:1px solid var(--chrome-border); border-radius:9px; background:var(--chrome-surface); color:var(--chrome-text); font-family:'IBM Plex Sans',sans-serif; font-size:12.5px; padding:0 8px; outline:none;}
[data-theme="light"] #dateInput{color-scheme:light;}
[data-theme="dark"] #dateInput,:root:not([data-theme]) #dateInput{color-scheme:dark;}
.sports-row{padding:12px 18px; display:flex; gap:8px;}
.sports-btn{display:flex; align-items:center; gap:8px; background:var(--chrome-surface); border:1px solid var(--amber); color:var(--amber); border-radius:9px; padding:10px 16px; font-family:inherit; font-size:13.5px; font-weight:600; cursor:pointer;}
.sports-btn .badge{background:var(--amber); color:var(--ink); border-radius:999px; min-width:20px; height:20px; padding:0 5px; display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;}
.sport-sheet-row{display:flex; align-items:center; justify-content:space-between; padding:13px 2px; border-top:1px solid rgba(0,0,0,0.08); font-family:'IBM Plex Sans',sans-serif; font-size:14.5px; font-weight:500; color:#10151F; cursor:pointer;}
.sport-sheet-row .meta{display:flex; align-items:center; gap:9px;}
.sport-sheet-row .dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
.sport-sheet-row .count{font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8A8578;}
.sport-check{width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0;}
.sport-check.on{background:var(--amber); color:#10151F;}
.sport-check.off{border:1.5px solid rgba(0,0,0,0.2);}
.sheet-link{background:none; border:none; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.3px; color:#4A9FE0; text-decoration:underline; cursor:pointer; padding:0;}
.toggle-row{display:flex; gap:8px; padding:0 18px 12px;}
.active-filters{display:flex; gap:7px; flex-wrap:wrap; align-items:center; padding:0 18px 12px;}
.filter-pill{display:flex; align-items:center; gap:6px; background:var(--chrome-surface); border:1px solid; border-radius:999px; padding:5px 6px 5px 12px; font-family:'IBM Plex Sans',sans-serif; font-size:12px; font-weight:600; white-space:nowrap;}
.filter-pill .pill-x{width:16px; height:16px; border-radius:50%; background:rgba(128,128,128,0.2); display:flex; align-items:center; justify-content:center; font-size:9px; border:none; color:inherit; cursor:pointer; flex-shrink:0;}
.filter-pill.f-sport{border-color:#FFB100; color:#FFB100;}
.filter-pill.f-date{border-color:#9ACD32; color:#9ACD32;}
.filter-pill.f-search{border-color:#4A9FE0; color:#4A9FE0;}
.filter-pill.f-near{border-color:#E85D75; color:#E85D75;}
.clear-all-btn{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--chrome-text-muted); text-decoration:underline; background:none; border:none; cursor:pointer; padding:4px;}
.toggle-btn{flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:9px 0; border-radius:8px; border:none; font-weight:600; font-size:13px; background:var(--chrome-surface); color:var(--chrome-text); font-family:inherit;}
.toggle-btn.active{background:var(--amber); color:var(--ink);}
.saved-toggle{flex:0 0 auto; padding:9px 12px; border-radius:8px; border:none; font-weight:600; font-size:13px; background:var(--chrome-surface); color:var(--chrome-text); font-family:inherit;}
.saved-toggle.active{background:#E85D75; color:var(--ink);}
.body{flex:1; position:relative; overflow:hidden;}
.view{position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch; display:none;}
.view.active-view{display:block;}
/* Desktop: Map and List shown side by side, not toggled — there's room
   for both, and a map-plus-list split view is the established pattern
   for this kind of app (Google Maps, Airbnb, Zillow all do this once
   there's space). The Map/List toggle buttons still exist underneath
   but are hidden here, since there's no single "active view" to toggle
   between anymore — both are always showing. */
@media (min-width: 900px){
  .body{display:grid; grid-template-columns: 420px 1fr; grid-template-rows: 1fr;}
  .view{position:relative; inset:auto; display:block !important; height:100%; min-height:0; overflow-y:auto;}
  #listView{border-right:1px solid var(--chrome-border); grid-column:1; grid-row:1;}
  #mapView{grid-column:2; grid-row:1;}
  #mapBtn, #listBtn{display:none;}
  /* .body's other children (sheetHost, sportSheetHost, countrySheetHost,
     authHost) are empty pass-through containers for modals that position
     themselves via their own fixed/absolute styling — without this,
     display:grid on .body auto-places them as extra implicit grid rows
     too, which was silently breaking mapView/listView's height
     resolution (their real bug: 4 implicit rows instead of the intended
     1, since these hosts count as grid items by default). display:contents
     removes them from grid layout participation entirely while their
     injected modal content still renders and positions itself correctly. */
  #sheetHost, #sportSheetHost, #countrySheetHost, #authHost{display:contents;}
}
/* Wide desktop: both the map AND the list get more room, rather than one
   growing at the other's expense — this app needs the map genuinely large
   enough to judge "what's near me" at a glance, AND a list that doesn't
   waste a wide screen's width on a single narrow column. Below this
   breakpoint, the 900px layout above still applies unchanged (side by
   side, single-column list) — this is additive, not a replacement. Placed
   directly after the block it overrides, since CSS resolves ties between
   equal-specificity rules by source order, not by which media query is
   "more specific" — an earlier version of this rule was placed near the
   *other*, unrelated 900px block further up and silently lost every tie.
*/
@media (min-width: 1300px){
  #app{max-width:1500px;}
  .body{grid-template-columns: 640px 1fr;}
}
.map-canvas{height:100%; position:relative; isolation:isolate;}
#leafletMap{position:absolute; inset:0;}
.map-label{position:absolute; top:10px; left:14px; z-index:500; font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--map-label-text); letter-spacing:0.4px; background:var(--map-label-bg); padding:3px 7px; border-radius:5px; pointer-events:none; transition:background 0.2s ease, color 0.2s ease;}
.leaflet-popup-content-wrapper{background:#F5F1E8; color:#10151F; border-radius:10px;}
.leaflet-popup-content{font-family:'IBM Plex Sans',sans-serif; font-size:13px; margin:9px 11px;}
.leaflet-popup-tip{background:#F5F1E8;}
.pin-dot{border-radius:50%; border:2px solid #10151F; box-shadow:0 0 0 3px rgba(255,255,255,0.2);}
.user-dot{width:14px; height:14px; border-radius:50%; background:#4A9FE0; border:3px solid #FFFFFF; box-shadow:0 0 0 4px rgba(74,159,224,0.35), 0 2px 6px rgba(0,0,0,0.4);}
.locate-btn{position:absolute; left:10px; bottom:10px; z-index:500; width:38px; height:38px; border-radius:8px; border:none; background:#F5F1E8; color:#10151F; font-size:17px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.35); cursor:pointer;}
.locate-btn.active{background:#4A9FE0; color:#fff;}
.leaflet-control-attribution{font-size:9.5px !important;}
.pin{position:absolute; width:17px; height:17px; border-radius:50%; border:2px solid var(--ink); box-shadow:0 0 0 3px rgba(255,255,255,0.08); transform:translate(-50%,-50%); padding:0;}
.empty{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; padding:24px; text-align:center;}
.empty span{font-size:13px; color:var(--chrome-text-muted);}
.list{padding:14px 18px 24px; display:flex; flex-direction:column; gap:10px;}
/* Placed directly after the rule it overrides — same lesson as the .body
   grid fix above: equal-specificity rules resolve ties by source order,
   not by which media query condition is "more specific." */
@media (min-width: 1300px){
  .list{display:grid; grid-template-columns:repeat(2, 1fr); align-content:start;}
}
.card{position:relative; text-align:left; width:100%; background:var(--paper); border:none; border-radius:10px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; font-family:inherit; cursor:pointer;}
.card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding-right:30px;}
.card-sport{font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600; letter-spacing:0.4px; text-transform:uppercase;}
.card-title{font-family:'Oswald',sans-serif; font-size:18px; font-weight:600; color:var(--ink); line-height:1.15; margin-top:2px;}
.card-dot{width:8px; height:8px; border-radius:50%; margin-top:6px; flex-shrink:0;}
.card-meta{display:flex; align-items:center; gap:12px; font-size:12.5px; color:#4A4636; flex-wrap:wrap;}
.pill{font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:500; letter-spacing:0.3px; text-transform:uppercase; border-radius:4px; padding:3px 6px; display:inline-block; width:fit-content;}
.save-btn{position:absolute; top:12px; right:12px; background:none; border:none; font-size:18px; padding:4px; cursor:pointer; line-height:1;}
.scrim{position:absolute; inset:0; background:rgba(16,21,31,0.72); display:flex; align-items:flex-end; z-index:2000;}
.sheet{background:var(--paper); width:100%; border-radius:16px 16px 0 0; padding:20px 20px calc(env(safe-area-inset-bottom) + 22px); display:flex; flex-direction:column; gap:14px; color:var(--ink); max-height:80%; overflow-y:auto;}
.sheet-top{display:flex; justify-content:space-between; align-items:flex-start;}
.sheet-sport{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; letter-spacing:0.4px; text-transform:uppercase;}
.sheet-title{font-family:'Oswald',sans-serif; font-size:24px; font-weight:600; margin-top:4px;}
.sheet-close{background:none; border:none; font-size:20px; color:#4A4636; padding:4px;}
.sheet-meta{display:flex; flex-direction:column; gap:6px; font-size:13.5px; color:#332F24;}
.sheet-blurb{font-size:13.5px; color:#4A4636; line-height:1.5; font-style:italic;}
.sheet-source{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--slate);}
.cta{margin-top:4px; border:none; border-radius:8px; padding:14px 16px; font-family:inherit; font-weight:600; font-size:14px; display:flex; align-items:center; justify-content:center; gap:8px;}
/* Auth sheet */
.auth-tabs{display:flex; gap:0; border-bottom:1px solid rgba(0,0,0,0.1);}
.auth-tab{flex:1; padding:10px 0; text-align:center; font-family:inherit; font-weight:600; font-size:13.5px; background:none; border:none; color:#8A8578; border-bottom:2px solid transparent;}
.auth-tab.active{color:var(--ink); border-bottom:2px solid var(--amber);}
.field{display:flex; flex-direction:column; gap:5px;}
.field label{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.3px; text-transform:uppercase; color:#6B6558;}
.field input{font-family:inherit; font-size:14.5px; padding:11px 12px; border-radius:8px; border:1px solid rgba(0,0,0,0.15); background:#FFFFFF;}
.auth-error{font-size:12.5px; color:var(--sold);}
.profile-row{display:flex; align-items:center; gap:12px; padding:4px 0 8px;}
.profile-avatar{width:44px; height:44px; border-radius:50%; background:var(--amber); color:var(--ink); display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:700; font-size:18px; flex-shrink:0;}
.profile-name{font-family:'Oswald',sans-serif; font-size:17px; font-weight:600;}
.profile-email{font-family:'IBM Plex Sans',sans-serif; font-size:12px; color:#6B6558;}
.menu-item{text-align:left; background:none; border:none; font-family:inherit; font-size:14.5px; padding:13px 2px; border-top:1px solid rgba(0,0,0,0.08); color:var(--ink);}
.menu-item.danger{color:var(--sold);}
.note{font-size:12px; color:#8A8578; line-height:1.5;}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-row">
      <span class="wordmark">FIXTURE<span class="dot">.</span></span>
      <div class="header-right">
        <span class="count" id="eventCount">0 EVENTS</span>
        <button class="theme-btn" id="themeBtn" title="Toggle dark/light mode">🌙</button>
        <button class="avatar-btn" id="avatarBtn">☺</button>
      </div>
    </div>
  </div>
  <div class="live-status" id="liveStatus" style="display:none;"><span class="live-dot"></span><span id="liveStatusText"></span></div>
  <div class="search-row">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="search" id="searchInput" placeholder="Search teams, venues, competitions…" autocomplete="off">
    </div>
    <input type="date" id="dateInput" min="2026-08-01" max="2027-07-17" title="Filter by date">
  </div>
  <div class="sports-row">
    <button class="sports-btn" id="sportsBtn">🏆 <span id="sportsBtnLabel">Sports</span></button>
    <button class="sports-btn" id="countryBtn">🌍 <span id="countryBtnLabel">Countries</span></button>
  </div>
  <div class="toggle-row">
    <button class="toggle-btn active" id="mapBtn">⊡ Map</button>
    <button class="toggle-btn" id="listBtn">☰ List</button>
    <button class="saved-toggle" id="savedBtn">♥ Saved</button>
  </div>
  <div class="active-filters" id="activeFilters"></div>
  <div class="body">
    <div class="view active-view" id="mapView"></div>
    <div class="view" id="listView"></div>
    <div id="sheetHost"></div>
    <div id="sportSheetHost"></div>
    <div id="countrySheetHost"></div>
    <div id="authHost"></div>
  </div>
</div>

<script>
const SPORTS = {
  football: { name: "Football", color: "#FFB100" },
  rugby: { name: "Rugby", color: "#B4483C" },
  rugbyleague: { name: "Rugby League", color: "#1B998B" },
  basketball: { name: "Basketball", color: "#E8722C" },
  tennis: { name: "Tennis", color: "#9ACD32" },
  golf: { name: "Golf", color: "#2F6F4F" },
  cricket: { name: "Cricket", color: "#D8CBA0" },
  netball: { name: "Netball", color: "#E85D75" },
  icehockey: { name: "Ice Hockey", color: "#6FB7C9" },
  snooker: { name: "Snooker", color: "#7A3B69" },
  boxing: { name: "Boxing", color: "#E63946" },
  darts: { name: "Darts", color: "#D4A017" },
  americanfootball: { name: "American Football", color: "#8B4513" },
  athletics: { name: "Athletics", color: "#5B8C5A" },
};

// Every dynamic value below gets inserted via innerHTML template literals
// for simplicity, which means anything user-supplied (currently: account
// name and email) MUST be escaped before interpolation, or a name like
// <img src=x onerror=alert(1)> would execute as real HTML. Event data isn't
// user-generated today, but is escaped too on the assumption a future admin
// CMS (per the backend architecture doc) will make it editable content.
function esc(str){
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
// Strips accents/diacritics so "atletico" matches "Atlético", "munchen"
// matches "München", etc. — important now that the dataset includes
// non-UK cities/teams, and only going to matter more as this expands
// further across Europe.
function normalizeText(str){
  return String(str ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}
function title(ev){ return ev.eventName || `${ev.home} v ${ev.away}`; }
function filteredEvents(){
  const searching = state.search.trim().length > 0;
  let list;
  if (state.showSaved) {
    const savedIds = currentUser ? currentUser.saved : new Set();
    list = EVENTS.filter(e => savedIds.has(e.id) && state.sports.has(e.sport) && state.countries.has(CITIES[e.city].country));
  } else {
    // No city selector anymore — every event is always in scope, everywhere.
    // Narrowing down to a specific place is what search and "near me" are for.
    list = EVENTS.filter(e => state.sports.has(e.sport) && state.countries.has(CITIES[e.city].country));
  }
  // Fixtures before today are out of date and hidden automatically — this
  // re-evaluates against the real date every time the page loads, so it
  // stays correct as days pass rather than needing manual upkeep.
  list = list.filter(e => e.isoDate >= TODAY_ISO);
  if (state.date) {
    list = list.filter(e => e.isoDate === state.date);
  }
  if (searching) {
    // Match each typed word independently (AND, any order) rather than the
    // whole query as one contiguous substring — "chelsea arsenal" now finds
    // "Arsenal v Chelsea" even though the words appear in the opposite order.
    const terms = normalizeText(state.search.trim()).split(/\s+/).filter(Boolean);
    list = list.filter(e => {
      const haystack = normalizeText([title(e), e.venue, e.area, e.tier, CITIES[e.city].name, CITIES[e.city].country, SPORTS[e.sport].name].filter(Boolean).join(' '));
      return terms.every(term => haystack.includes(term));
    });
  }
  return list;
}


// Computes how many events each sport contributes under the CURRENT
// filters (date/search/saved/location) but deliberately ignoring the sport
// filter itself — this is what lets the sport-selection sheet only list
// sports that actually have something to show right now, rather than
// always listing all of them regardless of relevance.
function sportEventCounts(){
  const searching = state.search.trim().length > 0;
  let base;
  if (state.showSaved) {
    const savedIds = currentUser ? currentUser.saved : new Set();
    base = EVENTS.filter(e => savedIds.has(e.id));
  } else {
    base = EVENTS.slice();
  }
  base = base.filter(e => state.countries.has(CITIES[e.city].country));
  base = base.filter(e => e.isoDate >= TODAY_ISO);
  if (state.date) base = base.filter(e => e.isoDate === state.date);
  if (searching) {
    const terms = normalizeText(state.search.trim()).split(/\s+/).filter(Boolean);
    base = base.filter(e => {
      const haystack = normalizeText([title(e), e.venue, e.area, e.tier, CITIES[e.city].name, CITIES[e.city].country, SPORTS[e.sport].name].filter(Boolean).join(' '));
      return terms.every(term => haystack.includes(term));
    });
  }
  const counts = {};
  base.forEach(e => { counts[e.sport] = (counts[e.sport] || 0) + 1; });
  return counts;
}

const FALLBACK_MAP_CENTER = [52.8, -1.6];
let userLocation = null; // { lat, lng } once the user grants location access

function distanceKm(lat1, lng1, lat2, lng2){
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function locateMe(){
  const btn = document.getElementById('locateBtn');
  const label = document.getElementById('mapLabel');
  if (!navigator.geolocation){
    if (label) { label.textContent = 'Location not supported on this device'; setTimeout(() => { if(label) label.textContent = 'tap a pin'; }, 3000); }
    return;
  }
  if (label) label.textContent = 'Finding you…';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if (btn) btn.classList.add('active');
      if (leafletMap){
        if (userMarker) leafletMap.removeLayer(userMarker);
        userMarker = L.marker([userLocation.lat, userLocation.lng], {
          icon: L.divIcon({ className: '', html: '<div class="user-dot"></div>', iconSize: [14,14], iconAnchor: [7,7] }),
          zIndexOffset: 1000,
        }).addTo(leafletMap).bindPopup('You are here');
        leafletMap.setView([userLocation.lat, userLocation.lng], 13);
      }
      renderAll();
    },
    (err) => {
      if (label){ label.textContent = err.code === 1 ? 'Location permission denied' : 'Location unavailable'; setTimeout(() => { if(label) label.textContent = 'tap a pin'; }, 3000); }
    },
    { enableHighAccuracy: true, timeout: 8000 }
  );
}

function ensureLeafletMap(){
  if (leafletMap || leafletFailed) return;
  const el = document.getElementById('mapView');
  if (typeof L === 'undefined'){
    // Leaflet's CDN script didn't load. The single most common real-world
    // cause: the page was opened by tapping a downloaded file directly
    // (file:// origin), and Safari/mobile browsers deliberately restrict
    // local files from loading external resources as a security measure —
    // list view still works because it needs nothing from the internet;
    // the map does, and that's exactly what's being blocked. Detecting
    // this case specifically means the message can say what to actually do
    // about it, rather than a generic "check your connection."
    leafletFailed = true;
    el.innerHTML = `<div class="map-canvas"><div class="empty">${fileOriginHint()}</div></div>`;
    return;
  }
  try{
    el.innerHTML = `<div class="map-canvas"><div id="leafletMap"></div><div class="map-label" id="mapLabel">tap a pin</div><button class="locate-btn" id="locateBtn" title="Use my location">◎</button><div class="empty" id="mapEmpty" style="display:none;"><span></span></div></div>`;
    leafletMap = L.map('leafletMap', { zoomControl: false }).setView(FALLBACK_MAP_CENTER, 6);
    L.control.zoom({ position: 'bottomright' }).addTo(leafletMap);
    // CartoDB's free tiles — dark or light variant depending on the app's
    // current theme, rather than always using OSM's default light style.
    // Same OSM data underneath either way, no API key required.
    leafletTileLayer = L.tileLayer(TILE_URLS[theme], {
      maxZoom: 19,
      subdomains: 'abcd',
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    }).addTo(leafletMap);
    document.getElementById('locateBtn').onclick = locateMe;
  }catch(err){
    console.error('Map init failed:', err);
    leafletFailed = true;
    el.innerHTML = `<div class="map-canvas"><div class="empty">${fileOriginHint()}</div></div>`;
  }
}

function renderMap(){
  ensureLeafletMap();
  if (leafletFailed || !leafletMap) return; // fallback message already shown; nothing more to render
  const emptyEl = document.getElementById('mapEmpty');
  leafletMarkers.forEach(m => leafletMap.removeLayer(m));
  leafletMarkers = [];

  if (loadingEvents){
    emptyEl.style.display = 'flex';
    emptyEl.querySelector('span').textContent = 'Loading events…';
    return;
  }
  const evs = filteredEvents();
  // The map simply shows whatever filteredEvents() returns — same source
  // of truth as list view. Empty only happens when filters genuinely
  // produce zero results (e.g. every sport deselected), never just
  // because nothing happens to be narrowed down. A previous version
  // deliberately hid all pins by default (with everything selected,
  // hasActiveNarrowing() was false) to avoid an "overwhelming" full-map
  // view — but that meant opening the app fresh, with every sport and
  // country selected, showed an empty map for no real reason. Reverted.
  if (evs.length === 0){
    emptyEl.style.display = 'flex';
    emptyEl.querySelector('span').textContent = state.showSaved
      ? 'No saved events yet — tap ♥ on any event to save it.'
      : 'No events match your filters here yet.';
    return;
  }

  // Multiple upcoming fixtures often share a venue (a stadium hosting
  // several matches across the window) — plotting one pin per event would
  // stack them exactly on top of each other at that venue's coordinates.
  // Group by venue, keep only the soonest event as the pin, and badge it
  // with a count so it's clear there's more to see — the list view (using
  // the same filteredEvents(), unmodified) still shows every fixture.
  const byVenue = new Map();
  evs.forEach(ev => {
    const existing = byVenue.get(ev.venue);
    if (!existing) { byVenue.set(ev.venue, { soonest: ev, count: 1 }); return; }
    existing.count += 1;
    const evKey = ev.isoDate + ev.time, exKey = existing.soonest.isoDate + existing.soonest.time;
    if (evKey < exKey) existing.soonest = ev;
  });

  byVenue.forEach(({ soonest: ev, count }) => {
    // Defensive guard: one event with missing/invalid coordinates used to
    // crash this entire loop with "Invalid LatLng object," which halted
    // renderMap() mid-way and left the whole page in a broken state (list
    // view stuck, status message never updated) — not just that one pin
    // missing. Skip just this one pin instead of taking down the render.
    if (typeof ev.lat !== 'number' || typeof ev.lng !== 'number' || isNaN(ev.lat) || isNaN(ev.lng)){
      console.warn(`Skipping map pin for event ${ev.id} (${title(ev)}) — missing or invalid coordinates.`);
      return;
    }
    const color = SPORTS[ev.sport].color;
    const badge = count > 1
      ? `<div style="position:absolute; top:-5px; right:-5px; width:15px; height:15px; border-radius:50%; background:#10151F; color:#FFB100; font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:600; display:flex; align-items:center; justify-content:center; border:1.5px solid #FFB100;">${count}</div>`
      : '';
    const icon = L.divIcon({
      className: '',
      html: `<div style="position:relative;"><div class="pin-dot" style="width:18px;height:18px;background:${color};"></div>${badge}</div>`,
      iconSize: [18, 18],
      iconAnchor: [9, 9],
    });
    const label = count > 1 ? `${title(ev)} (+${count - 1} more here)` : title(ev);
    const marker = L.marker([ev.lat, ev.lng], { icon, title: label }).addTo(leafletMap);
    // Deliberately no popup here — tapping a pin goes straight to the same
    // full detail sheet used by list cards, rather than showing a small
    // popup bubble AND the sheet at once (which is what used to happen:
    // both were wired to the same click, which looked confusing/broken).
    marker.on('click', () => openSheet(ev.id));
    leafletMarkers.push(marker);
  });

  // Auto-fit the map to whatever's actually visible, rather than staying at
  // a fixed city-wide zoom — a filtered-down set of 2 events on one side of
  // town shouldn't leave the map showing mostly empty space.
  const bounds = L.latLngBounds(evs.map(e => [e.lat, e.lng]));
  if (userLocation) bounds.extend([userLocation.lat, userLocation.lng]);
  leafletMap.fitBounds(bounds, { padding: [36, 36], maxZoom: 14 });
  emptyEl.style.display = 'none';
}

function isSaved(id){ return currentUser && currentUser.saved.has(id); }

function renderList(){
  const el = document.getElementById('listView');
  if (loadingEvents){ el.innerHTML = `<div class="empty" style="position:static; padding-top:60px;"><span>Loading events…</span></div>`; return; }
  const evs = filteredEvents().slice().sort((a, b) => {
    if (userLocation){
      return distanceKm(userLocation.lat, userLocation.lng, a.lat, a.lng) - distanceKm(userLocation.lat, userLocation.lng, b.lat, b.lng);
    }
    // Sort by the real ISO date + time, not the display string ("Sat 05
    // Sep") — comparing display strings alphabetically sorts by day-name
    // (Fri/Mon/Sat/Sun...) rather than by actual date, which is why this
    // wasn't chronological before.
    return (a.isoDate + a.time).localeCompare(b.isoDate + b.time);
  });
  if (evs.length===0){
    el.innerHTML = `<div class="empty" style="position:static; padding-top:60px;"><span>${state.showSaved ? "No saved events yet — tap ♥ on any event to save it." : "No events match your filters here yet."}</span></div>`;
    return;
  }
  let html = `<div class="list">`;
  const showCity = true; // no city selector anymore — always show which city each event is in
  evs.forEach(ev => {
    const s = SPORTS[ev.sport];
    html += `
      <div class="card" data-id="${ev.id}">
        <button class="save-btn" data-save="${ev.id}">${isSaved(ev.id) ? '♥' : '♡'}</button>
        <div class="card-top">

            <div class="card-sport" style="color:${s.color}">${esc(s.name)} · ${esc(ev.tier)}</div>
            <div class="card-title">${esc(title(ev))}</div>
          </div>
          <span class="card-dot" style="background:${s.color}"></span>
        </div>
        <div class="card-meta">
          <span>📍 ${esc(ev.venue)}, ${esc(ev.area)}${showCity ? ` · ${esc(CITIES[ev.city].name)}` : ''}</span>
          <span>🕒 ${esc(ev.date)}, ${esc(ev.time)} ${getTzLabel(ev.city, ev.isoDate)}</span>
          ${userLocation ? `<span>📏 ${distanceKm(userLocation.lat, userLocation.lng, ev.lat, ev.lng).toFixed(1)} km</span>` : ''}
        </div>
        <div style="display:flex; align-items:center;">
          ${statusPillHtml(ev.status)}
          ${TAG_BADGE[ev.tag]}
        </div>
      </div>`;
  });

}

async function submitAuth(){
  const email = document.getElementById('fEmail').value.trim().toLowerCase();
  const pass = document.getElementById('fPass').value;
  if (!email || !pass){ authError = "Enter an email and password."; renderAuth(); return; }

  if (usingBackend){
    try{
      if (authMode === 'register'){
        const name = document.getElementById('fName').value.trim();
        if (!name){ authError = "Enter your name."; renderAuth(); return; }
        const res = await fetch(`${API_BASE}/api/register`, {
          method:"POST", headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ name, email, password: pass }),
        });
        const data = await res.json();
        if (!res.ok){ authError = data.error || "Registration failed."; renderAuth(); return; }
        authToken = data.token;
        currentUser = { ...data.user, saved: new Set(data.user.favorites || []) };
      } else {
        const res = await fetch(`${API_BASE}/api/login`, {
          method:"POST", headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ email, password: pass }),
        });
        const data = await res.json();
        if (!res.ok){ authError = data.error || "Login failed."; renderAuth(); return; }
        authToken = data.token;
        currentUser = { ...data.user, saved: new Set(data.user.favorites || []) };
      }
      closeAuth();
      renderAll();
    }catch(err){
      authError = "Couldn't reach the backend. Check API_BASE is set correctly.";
      renderAuth();
    }
    return;
  }

  // Standalone demo mode — in-memory only, no backend configured
  if (authMode === 'register'){
    const name = document.getElementById('fName').value.trim();
    if (!name){ authError = "Enter your name."; renderAuth(); return; }
    if (USERS.find(u => u.email === email)){ authError = "An account with that email already exists — try logging in instead."; renderAuth(); return; }
    const user = { name, email, password: pass, saved: new Set() };
    USERS.push(user);
    currentUser = user;
    closeAuth();
    renderAll();
  } else {
    const user = USERS.find(u => u.email === email && u.password === pass);
    if (!user){ authError = "No matching account in this session. Accounts reset on reload — try registering."; renderAuth(); return; }
    currentUser = user;
    closeAuth();
    renderAll();
  }
}

// Every displayed time is the TRUE LOCAL TIME AT THE VENUE — this is the
// sports-media convention (kickoff times are always stated in local time
// by clubs, broadcasters, and ticket sites, never converted to the
// reader's own timezone), not just a display shortcut. This function
// labels each time with its timezone abbreviation so a cross-city list
// mixing e.g. London and Barcelona fixtures is unambiguous. UK/Ireland
// and continental Europe (CET/CEST) both observe DST, switching on the
// same date (last Sunday of October) but sitting at different UTC
// offsets — continental Europe is always 1 hour ahead of the UK/Ireland,
// both in summer and winter. Hardcoded to 2026's transition date (25
// Oct) since that's the only year this dataset covers; would need
// generalizing (last-Sunday-of-October calculation) if the app tracks
// events beyond 2026.
const DST_END_2026 = '2026-10-25';
function getTzLabel(cityId, isoDate){
  const country = CITIES[cityId] ? CITIES[cityId].country : 'UK';
  const isSummer = isoDate < DST_END_2026;
  if (country === 'Ireland') return isSummer ? 'IST' : 'GMT';
  if (country === 'UK') return isSummer ? 'BST' : 'GMT';
  return isSummer ? 'CEST' : 'CET';
}

function formatIsoDateShort(iso){
  const d = new Date(iso + 'T00:00:00');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${d.getDate()} ${months[d.getMonth()]}`;
}

function renderActiveFilters(){
  const el = document.getElementById('activeFilters');
  const pills = [];
  const totalSports = Object.keys(SPORTS).length;
  const totalCountries = new Set(Object.values(CITIES).map(c => c.country)).size;

  if (state.sports.size < totalSports){
    const label = state.sports.size === 1
      ? `${SPORTS[[...state.sports][0]].name} only`
      : `${state.sports.size} sports`;
    pills.push(`<div class="filter-pill f-sport">${esc(label)}<button class="pill-x" data-clear="sport">✕</button></div>`);
  }
  if (state.countries.size < totalCountries){
    const label = state.countries.size === 1
      ? `${[...state.countries][0]} only`
      : `${state.countries.size} countries`;
    pills.push(`<div class="filter-pill f-sport">🌍 ${esc(label)}<button class="pill-x" data-clear="country">✕</button></div>`);
  }
  if (state.date){
    pills.push(`<div class="filter-pill f-date">📅 ${esc(formatIsoDateShort(state.date))}<button class="pill-x" data-clear="date">✕</button></div>`);
  }
  if (state.search.trim()){
    const shown = state.search.length > 16 ? state.search.slice(0, 16) + '…' : state.search;
    pills.push(`<div class="filter-pill f-search">🔍 "${esc(shown)}"<button class="pill-x" data-clear="search">✕</button></div>`);
  }
  if (userLocation){
    pills.push(`<div class="filter-pill f-near">📍 Near me<button class="pill-x" data-clear="near">✕</button></div>`);
  }

  if (pills.length === 0){ el.innerHTML = ''; return; }
  el.innerHTML = pills.join('') + `<button class="clear-all-btn" id="clearAllFiltersBtn">Clear all</button>`;

  el.querySelectorAll('[data-clear]').forEach(btn => {
    btn.onclick = () => {
      const kind = btn.dataset.clear;
      if (kind === 'sport') clearSportFilter();
      else if (kind === 'country') clearCountryFilter();
      else if (kind === 'date') setSearchAndDate(state.search, '');
      else if (kind === 'search') setSearchAndDate('', state.date);
      else if (kind === 'near') clearLocationFilter();
    };
  });
  const clearAllBtn = document.getElementById('clearAllFiltersBtn');
  if (clearAllBtn) clearAllBtn.onclick = clearAllFilters;
}

// ---- Live fetch attempt (see chat explanation: usually blocked by CORS on
// the API's side; falls back cleanly to the REAL static snapshot above) ----
let loadingEvents = false;
// With no city selector, the app always fetches the full all-cities dataset
// once at startup — everything after that (sport/date/search/saved) filters
// client-side against it.
async function loadAllEvents(){
  loadingEvents = true;
  renderAll();
  try{
    // Fetch sports/cities alongside events, not just events alone — the
    // static SPORTS/CITIES objects baked into this HTML file are a
    // snapshot from whenever it was last regenerated. If the live
    // backend has grown since (a new sport or city added), those IDs
    // wouldn't exist in the static objects at all, which risks more than
    // just a filtering gap — anything reading CITIES[cityId].name or
    // SPORTS[sportId].color for one of those events would hit undefined
    // and could break rendering entirely, not just under-count events.
    // Found the under-counting symptom via direct testing (EVENTS.length
    // was correct at 156, filteredEvents() incorrectly returned 137) and
    // traced it back to this same root cause.
    const [eventsRes, sportsRes, citiesRes] = await Promise.all([
      fetch(`${API_BASE}/api/events`),
      fetch(`${API_BASE}/api/sports`),
      fetch(`${API_BASE}/api/cities`),
    ]);
    if (eventsRes.ok) EVENTS = await eventsRes.json();
    if (sportsRes.ok){
      const liveSports = await sportsRes.json();
      liveSports.forEach(s => { SPORTS[s.id] = { name: s.name, color: s.color }; });
    }
    if (citiesRes.ok){
      const liveCities = await citiesRes.json();
      liveCities.forEach(c => { CITIES[c.id] = { name: c.name, country: c.country }; });
    }
    // Now that SPORTS/CITIES definitely include everything EVENTS
    // actually references, it's safe to also default the filter state to
    // "everything selected" using the now-complete lists — otherwise a
    // genuinely new sport/city would still silently be filtered out even
    // though it's now safe to render.
    EVENTS.forEach(e => {
      state.sports.add(e.sport);
      if (CITIES[e.city]) state.countries.add(CITIES[e.city].country);
    });
  }catch(err){ console.error(err); }
  loadingEvents = false;
  renderAll();
}

async function initBackendConnection(){
  if (!API_BASE) return; // standalone mode — no backend configured, nothing to report
  const statusEl = document.getElementById('liveStatus');
  const statusText = document.getElementById('liveStatusText');
  statusEl.style.display = 'flex';

  // Render's free tier fully stops the container after a period of
  // inactivity (not just "sleeping") and its own documented cold-start
  // time is up to ~50 seconds. Confirmed via Render's own server logs
  // directly: 6 separate successful startups, zero crashes — the server
  // itself is healthy every time, so a failure here isn't a server
  // problem. The REAL remaining bug, found after that ruled out a crash:
  // earlier versions of this function added delays BETWEEN attempts but
  // never put a timeout on any INDIVIDUAL attempt — if Render holds a
  // connection open while slowly booting rather than rejecting it
  // outright, one single fetch could hang far longer than intended,
  // silently eating the whole retry budget on one stuck attempt instead
  // of actually cycling through several. Each attempt below now aborts
  // itself if it takes too long, guaranteeing the loop actually retries
  // rather than potentially blocking on attempt #1 forever.
  const maxAttempts = 6;
  const delaysMs = [0, 3000, 8000, 8000, 8000, 8000];
  const perAttemptTimeoutMs = 15000; // each attempt gets a bounded window, not an open-ended wait
  for (let attempt = 0; attempt < maxAttempts; attempt++){
    if (delaysMs[attempt] > 0){
      statusText.textContent = `Waking up the backend (this can take up to a minute if it's been idle) — retrying (attempt ${attempt + 1}/${maxAttempts})...`;
      await new Promise(r => setTimeout(r, delaysMs[attempt]));
    }
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), perAttemptTimeoutMs);
    try{
      const res = await fetch(`${API_BASE}/api/health`, { signal: controller.signal });
      clearTimeout(timeoutId);
      if (!res.ok) throw new Error('unhealthy');
      usingBackend = true;
      statusEl.classList.remove('fail');
      statusEl.classList.add('ok');
      statusText.textContent = `✓ Connected to live backend at ${API_BASE}`;
      await loadAllEvents();
      return;
    }catch(err){
      clearTimeout(timeoutId);
      if (attempt === maxAttempts - 1){
        usingBackend = false;
        loadingEvents = false; // defensive reset — whatever set this true, the loading process has now definitively ended one way or another, so the list view shouldn't stay stuck showing "Loading events…" forever
        statusEl.classList.add('fail');
        statusText.textContent = `Could not reach backend at ${API_BASE} after several attempts — showing local demo data. If this backend runs on Render's free tier, it may just need longer to wake up; try refreshing the page in a minute.`;
        renderAll();
      }
      // otherwise loop continues to the next attempt
    }
  }
}

// The date picker can't be used to select a day that's already past —
// its minimum bound is today, not a fixed date, so this also stays
// correct automatically as real time moves forward.
(function(){
  const dateEl = document.getElementById('dateInput');
  const fixedMax = dateEl.getAttribute('max'); // 2026-12-31
  dateEl.min = TODAY_ISO > fixedMax ? fixedMax : TODAY_ISO;
})();

applyTheme();
renderAll();
setView('map');
if (API_BASE){
  initBackendConnection();
}
</script>
