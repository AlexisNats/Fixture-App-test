<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- This file exists only because GitHub Pages requires index.html to
       live at the repo root (or /docs) — it can't point at an arbitrary
       subfolder like /frontend. Rather than move the real app (which
       would break the paths archive-past-events.js, research-new-
       fixtures.js, and verify-and-merge-fixtures.js all already rely
       on), this is a one-time, never-needs-updating redirect straight
       to where the real app actually lives. -->
  <meta http-equiv="refresh" content="0; url=frontend/index.html">
  <title>Fixture</title>
</head>
<body>
  <p>Redirecting to <a href="frontend/index.html">the app</a>...</p>
</body>
</html>
